<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jason Brewer — Director of Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="site">
    <header class="masthead">
      <div>
        <h1 class="masthead__name">Jason Brewer</h1>
        <p class="masthead__role">Video Production Services</p>
      </div>
      <nav class="masthead__nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gear.html" aria-current="page">Gear</a>
        <a href="credit-list.html">Credits</a>
        <a href="#book" class="js-book">Contact</a>
      </nav>
    </header>

    <!-- Home grid renders here from HOME in js/data.js -->
    <main id="gallery" class="gallery" aria-label="Selected work"></main>

    <footer class="site-foot">
      <span>&copy; <span id="year"></span> Jason Brewer</span>
      <span>Richmond, VA</span>
    </footer>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

    <!-- ── Booking modal (Google Calendar) ───────────────────── -->
  <div class="book-overlay" id="bookOverlay" role="dialog" aria-modal="true" aria-label="Book a time">
    <div class="book-modal">
      <div class="book-head">
        <h3>Book a time</h3>
        <button class="book-close" id="bookClose" aria-label="Close">&times;</button>
      </div>
      <div class="book-body">
        <iframe id="bookFrame" title="Booking" loading="lazy" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <style>
    .book-overlay{position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.7);
      display:none; align-items:center; justify-content:center; padding:20px;}
    .book-overlay.open{display:flex;}
    .book-modal{background:#fff; border:1px solid #2e2c28; border-radius:16px;
      width:100%; max-width:820px; max-height:88vh; overflow:hidden; display:flex; flex-direction:column;}
    .book-head{display:flex; align-items:center; justify-content:space-between;
      padding:16px 20px; background:#141311; border-bottom:1px solid #2e2c28;}
    .book-head h3{font-family:'Archivo',sans-serif; font-weight:600; font-size:20px; margin:0; color:#e9e6df;}
    .book-close{background:none; border:0; color:#c98a3c; font-size:26px; line-height:1; cursor:pointer; padding:0 4px;}
    .book-close:hover{color:#e9e6df;}
    .book-body{position:relative; height:78vh;}
    .book-body iframe{width:100%; height:100%; border:0; display:block;}
  </style>

  <script>
  (function(){
    var CAL_IFRAME = "https://calendar.google.com/calendar/appointments/schedules/AcZssZ0qjWiIAEzrOzFrJyPog1yhmflvRvygPZNrkt3rDzJJODqFgFjuJjFt0MbrnmrnKViamDnOXc_w?gv=true";
    var CAL_LINK   = "https://calendar.app.google/YcjTkyQbm9hJv12t8";

    var overlay = document.getElementById('bookOverlay');
    var frame   = document.getElementById('bookFrame');
    var loaded  = false;
    function isMobile(){ return window.matchMedia('(max-width:767px)').matches; }
    function openBook(){
      if (isMobile()){ window.open(CAL_LINK, '_blank', 'noopener'); return; }
      if (!loaded){ frame.src = CAL_IFRAME; loaded = true; }
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeBook(){ overlay.classList.remove('open'); document.body.style.overflow = ''; }
    document.addEventListener('click', function(e){
      var b = e.target.closest('.js-book');
      if (b){ e.preventDefault(); openBook(); }
    });
    document.getElementById('bookClose').addEventListener('click', closeBook);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) closeBook(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeBook(); });
  })();
  </script>
</body>
</html>
