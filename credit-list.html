<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jason Brewer — Credits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/nav.js"></script>

  <!-- Styles for the credit list. Scoped under .creditlist so they
       won't collide with anything in css/styles.css. -->
  <style>
    .creditlist {
      --cl-ink:         #e9e6df;
      --cl-ink-soft:    #9a948a;
      --cl-line:        #2e2c28;
      --cl-line-strong: #4a463f;
      --cl-panel:       #232120;
      --cl-panel-hover: #2b2825;
      --cl-accent:      #c98a3c;

      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      color: var(--cl-ink);
      font-family: "Inter", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    .creditlist__title {
      font-family: "Archivo", sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.01em;
      margin: 0 0 20px;
    }

    /* ---- filter pills ---- */
    .creditlist #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .creditlist .pill {
      appearance: none;
      border: 1px solid var(--cl-line);
      background: var(--cl-panel);
      color: var(--cl-ink);
      font-family: "Archivo", sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 9px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .creditlist .pill:hover { background: var(--cl-panel-hover); }
    .creditlist .pill:focus-visible { outline: 2px solid var(--cl-accent); outline-offset: 2px; }
    .creditlist .pill[aria-pressed="true"] {
      background: var(--cl-accent);
      color: #1b1a18;
      border-color: var(--cl-accent);
    }
    .creditlist .pill .count {
      opacity: 0.55;
      margin-left: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* ---- status line ---- */
    .creditlist #status {
      margin: 0 0 18px;
      font-family: "Archivo", sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cl-ink-soft);
    }

    /* ---- table ---- */
    .creditlist table { width: 100%; border-collapse: collapse; }
    .creditlist thead th {
      text-align: left;
      font-family: "Archivo", sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cl-ink-soft);
      font-weight: 600;
      padding: 0 12px 10px 0;
      border-bottom: 1px solid var(--cl-line-strong);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .creditlist thead th:hover { color: var(--cl-ink); }
    .creditlist thead th.sort-asc::after  { content: " \2191"; color: var(--cl-accent); }
    .creditlist thead th.sort-desc::after { content: " \2193"; color: var(--cl-accent); }

    .creditlist tbody td {
      padding: 11px 12px 11px 0;
      border-bottom: 1px solid var(--cl-line);
      vertical-align: top;
    }
    .creditlist tbody tr:hover td { background: var(--cl-panel); }

    .creditlist td.project  { font-weight: 500; width: 36%; color: var(--cl-ink); }
    .creditlist td.episodes { white-space: nowrap; color: var(--cl-ink-soft); }
    .creditlist td.company,
    .creditlist td.network  { color: var(--cl-ink-soft); }
    .creditlist td.position { width: 22%; }

    .creditlist .award {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--cl-accent);
    }
    .creditlist .award::before { content: "\2605 "; }

    .creditlist #empty { display: none; padding: 36px 0; color: var(--cl-ink-soft); }

    /* ---- mobile: collapse the table into stacked rows ---- */
    @media (max-width: 640px) {
      .creditlist { padding: 16px 14px 48px; }
      .creditlist thead { display: none; }
      .creditlist table, .creditlist tbody, .creditlist tr, .creditlist td { display: block; width: 100%; }
      .creditlist tbody tr { padding: 13px 0; border-bottom: 1px solid var(--cl-line); }
      .creditlist tbody td { padding: 1px 0; border: none; }
      .creditlist tbody tr:hover td { background: transparent; }
      .creditlist td.project { width: auto; font-size: 16px; }
      .creditlist td.position { width: auto; margin-top: 2px; }
      .creditlist td.episodes,
      .creditlist td.company,
      .creditlist td.network { display: inline-block; width: auto; font-size: 13px; }
      .creditlist td.company:not(:empty)::before,
      .creditlist td.network:not(:empty)::before { content: "\00b7\00a0"; }
    }
    @media (prefers-reduced-motion: reduce) {
      .creditlist .pill { transition: none; }
    }
  </style>
</head>
<body>
  <div class="site">
    

    <!-- ===== Credit list (was a CodePen iframe, now native) ===== -->
    <main class="creditlist">
      <h2 class="creditlist__title">Full Credit List</h2>

      <nav id="filters" aria-label="Filter credits by position"></nav>
      <p id="status">Loading credits&hellip;</p>

      <table id="credits" hidden>
        <thead>
          <tr>
            <th data-key="project">Project</th>
            <th data-key="episodes">Episodes</th>
            <th data-key="company">Company</th>
            <th data-key="network">Network</th>
            <th data-key="position">Position</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p id="empty">No credits match this filter.</p>
    </main>
    <!-- ===== /Credit list ===== -->

    <footer class="site-foot">
      <span>&copy; <span id="year"></span> Jason Brewer</span>
      <span>Richmond, VA</span>
    </footer>
  </div>

  <script>
  /* =========================================================
     CONFIG — edit these two things and nothing else
     ========================================================= */

  // Live CSV feed of the published Google Sheet.
  // (File > Share > Publish to web, then add /pub?gid=0&single=true&output=csv)
  const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vRI1-O8Vf4YtB_W_4dWNP-gobYHZTyrFw6esr6AFZzLf1UzC-FVxMxP1zuugwy8rVjWCIq6GvFvJoK1/pub?gid=0&single=true&output=csv";

  const SPECIALIZED_PRODUCER = /(executive|supervising|development|associate)\s+producer/gi;

  const FILTERS = [
    { label: "All",                  match: null },
    { label: "Camera",               match: /camera/i },
    { label: "Drone",                match: /drone/i },
    { label: "Editor",               match: /editor/i },
    { label: "Director",             match: /director/i },
    { label: "Producer",             test: p => /producer/i.test(p.replace(SPECIALIZED_PRODUCER, "")) },
    { label: "Executive Producer",   match: /executive\s+producer/i },
    { label: "Supervising Producer", match: /supervising\s+producer/i },
    { label: "Development Producer", match: /development\s+producer/i },
    { label: "Associate Producer",   match: /associate\s+producer/i },
    { label: "Post Production Supervisor", match: /post\s*(production\s*)?supervisor/i },
    { label: "Writer",               match: /writer/i },
  ];

  /* =========================================================
     Parsing
     ========================================================= */
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        row.push(field); field = "";
      } else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        rows.push(row); row = [];
      } else {
        field += c;
      }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function processRows(rows) {
    let headerIdx = -1, col = {};
    for (let i = 0; i < rows.length; i++) {
      const lower = rows[i].map(c => (c || "").trim().toLowerCase());
      if (lower.includes("project") && lower.includes("position")) {
        headerIdx = i;
        col = {
          project: lower.indexOf("project"),
          episodes: lower.indexOf("episodes"),
          company: lower.indexOf("company"),
          network: lower.indexOf("network"),
          position: lower.indexOf("position"),
        };
        break;
      }
    }
    if (headerIdx === -1) return [];

    const cell = (r, idx) => (idx >= 0 && r[idx] != null ? String(r[idx]).trim() : "");
    const credits = [];

    for (let i = headerIdx + 1; i < rows.length; i++) {
      const r = rows[i];
      const project = cell(r, col.project);
      const position = cell(r, col.position);

      if (!project && !position) continue;

      if (project.startsWith("(") && !position) {
        if (credits.length) {
          const note = project.replace(/^\(\s*/, "").replace(/\s*\)$/, "");
          credits[credits.length - 1].award = note;
        }
        continue;
      }

      credits.push({
        project,
        episodes: cell(r, col.episodes),
        company: cell(r, col.company),
        network: cell(r, col.network),
        position,
        award: null,
      });
    }
    return credits;
  }

  /* =========================================================
     Rendering
     ========================================================= */
  const filtersEl = document.getElementById("filters");
  const statusEl  = document.getElementById("status");
  const tableEl   = document.getElementById("credits");
  const tbodyEl   = tableEl.querySelector("tbody");
  const emptyEl   = document.getElementById("empty");

  let allCredits = [];
  let activeFilter = FILTERS[0];
  let sortKey = null;
  let sortDir = 1;

  function matches(credit, filter) {
    if (filter.test) return filter.test(credit.position);
    if (!filter.match) return true;
    filter.match.lastIndex = 0;
    return filter.match.test(credit.position);
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderFilters() {
    filtersEl.innerHTML = "";
    FILTERS.forEach(f => {
      const btn = document.createElement("button");
      btn.className = "pill";
      btn.type = "button";
      btn.setAttribute("aria-pressed", f === activeFilter ? "true" : "false");
      const n = allCredits.filter(c => matches(c, f)).length;
      btn.innerHTML = esc(f.label) + '<span class="count">' + n + "</span>";
      btn.addEventListener("click", () => {
        activeFilter = f;
        renderFilters();
        renderTable();
      });
      filtersEl.appendChild(btn);
    });
  }

  function renderTable() {
    let list = allCredits.filter(c => matches(c, activeFilter));

    if (sortKey) {
      list = list.slice().sort((a, b) =>
        a[sortKey].localeCompare(b[sortKey], undefined, { numeric: true, sensitivity: "base" }) * sortDir
      );
    }

    tbodyEl.innerHTML = list.map(c => `
      <tr>
        <td class="project">${esc(c.project)}${c.award ? `<span class="award">${esc(c.award)}</span>` : ""}</td>
        <td class="episodes">${esc(c.episodes)}</td>
        <td class="company">${esc(c.company)}</td>
        <td class="network">${esc(c.network)}</td>
        <td class="position">${esc(c.position)}</td>
      </tr>`).join("");

    const label = activeFilter.label === "All" ? "" : " \u00b7 " + activeFilter.label;
    statusEl.textContent = list.length + (list.length === 1 ? " credit" : " credits") + label;

    tableEl.hidden = list.length === 0;
    emptyEl.style.display = list.length === 0 ? "block" : "none";
  }

  tableEl.querySelectorAll("thead th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (sortKey === key && sortDir === 1) {
        sortDir = -1;
      } else if (sortKey === key && sortDir === -1) {
        sortKey = null; sortDir = 1;
      } else {
        sortKey = key; sortDir = 1;
      }
      tableEl.querySelectorAll("thead th").forEach(h =>
        h.classList.remove("sort-asc", "sort-desc"));
      if (sortKey) th.classList.add(sortDir === 1 ? "sort-asc" : "sort-desc");
      renderTable();
    });
  });

  function show(credits) {
    allCredits = credits;
    renderFilters();
    renderTable();
  }

  /* =========================================================
     Boot: load the live sheet (the Google Sheet is the only source of data)
     ========================================================= */
  (async function init() {
    try {
      const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const credits = processRows(parseCSV(await res.text()));
      if (!credits.length) throw new Error("No rows parsed");
      show(credits);
    } catch (err) {
      console.error("Could not load the credits sheet:", err);
      statusEl.textContent = "Couldn\u2019t load the credit list right now. Please try again shortly.";
    }
  })();

  // Footer year (this page doesn't load app.js, so set it here).
  const yearEl = document.getElementById("year");
  if (yearEl) yearEl.textContent = new Date().getFullYear();
  </script>

   
 
</body>
</html>
